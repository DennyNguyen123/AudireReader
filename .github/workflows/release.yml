name: Auto Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: CHUẨN BỊ & KIỂM TRA CODE (Chạy 1 lần trên Linux)
  # ==========================================
  prepare-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run Code Generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Tests
        run: flutter test

      - name: Upload Generated Code
        uses: actions/upload-artifact@v4
        with:
          name: generated-dart-code
          path: lib/

  # ==========================================
  # JOB 2: BUILD PARALLEL QUA MATRIX
  # ==========================================
  build:
    needs: prepare-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            artifact_name: AudireReader-Android-APK
          - target: windows
            os: windows-latest
            artifact_name: AudireReader-Windows-ZIP
          - target: ios
            os: macos-latest
            artifact_name: AudireReader-iOS-IPA

    steps:
      # --- TỐI ƯU HỆ THỐNG WINDOWS ---
      - name: Optimize Windows Runner (Disable Defender & Search Indexer)
        if: matrix.target == 'windows'
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -DisableArchiveScanning $true -DisableBehaviorMonitoring $true -DisableIntrusionPreventionSystem $true -DisableScriptScanning $true
          Stop-Service wsearch -ErrorAction SilentlyContinue
          Set-Service wsearch -StartupType Disabled -ErrorAction SilentlyContinue
        shell: powershell

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Generated Code
        uses: actions/download-artifact@v4
        with:
          name: generated-dart-code
          path: lib

      # --- SETUP CHO TỪNG OS ---
      - name: Setup Java (Android)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle (Android)
        if: matrix.target == 'android'
        uses: gradle/actions/setup-gradle@v4

      - name: Setup CocoaPods (iOS)
        if: matrix.target == 'ios'
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: 1.16.2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # --- ANDROID KEYSTORE SETUP ---
      - name: Setup Android Release Keystore
        if: matrix.target == 'android' && env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # --- BUILD STEPS ---
      - name: Build Android APK
        if: matrix.target == 'android'
        run: |
          flutter build apk --release --target-platform android-arm64
          mv build/app/outputs/flutter-apk/app-release.apk AudireReader-Android-arm64.apk
        env:
          KEYSTORE_FILE: "release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Windows
        if: matrix.target == 'windows'
        run: |
          git config --system core.longpaths true
          flutter build windows --release
          dart run inno_bundle --no-app
          7z a -mx=4 AudireReader-Windows.zip .\build\windows\x64\runner\Release\*
          Move-Item build\windows\x64\installer\Release\*.exe AudireReader-Windows-Setup.exe
        shell: pwsh
        env:
          CARGO_INCREMENTAL: "0"

      - name: Build iOS
        if: matrix.target == 'ios'
        run: |
          PLIST_PATH="ios/Runner/Info.plist"
          plutil -insert UIBackgroundModes -xml "<array><string>audio</string></array>" $PLIST_PATH || true
          plutil -replace UISupportsDocumentBrowser -bool true $PLIST_PATH || true
          plutil -replace UIFileSharingEnabled -bool true $PLIST_PATH || true
          
          flutter build ios --release --no-codesign
          
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r AudireReader-iOS.ipa Payload

      # --- UPLOAD ARTIFACTS ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            AudireReader-Android-arm64.apk
            AudireReader-Windows.zip
            AudireReader-Windows-Setup.exe
            AudireReader-iOS.ipa
          if-no-files-found: ignore

  # ==========================================
  # JOB 3: TẠO RELEASE DRAFT/PUBLISH
  # ==========================================
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/AudireReader-Android-arm64.apk
            artifacts/AudireReader-Windows.zip
            artifacts/AudireReader-Windows-Setup.exe
            artifacts/AudireReader-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
