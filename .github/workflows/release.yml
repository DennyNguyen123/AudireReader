name: Auto Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: CHUẨN BỊ & KIỂM TRA CODE (Chạy 1 lần)
  # ==========================================
  prepare-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run Code Generation Check
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Tests
        run: flutter test

  # ==========================================
  # JOB 2: BUILD PARALLEL QUA MATRIX
  # ==========================================
  build:
    needs: prepare-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            artifact_name: AudireReader-Android-APK
          - target: windows
            os: windows-latest
            artifact_name: AudireReader-Windows-ZIP
          - target: ios
            os: macos-latest
            artifact_name: AudireReader-iOS-IPA

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- SETUP CHO TỪNG OS ---
      - name: Setup Java (Android)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle (Android)
        if: matrix.target == 'android'
        uses: gradle/actions/setup-gradle@v4

      - name: Setup CocoaPods (iOS)
        if: matrix.target == 'ios'
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: 1.16.2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run Code Generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      # --- BUILD STEPS ---
      - name: Build Android APK via Shorebird
        if: matrix.target == 'android'
        run: |
          shorebird release android --artifact apk --target-platform android-arm64 --flutter-version=3.41.9
          mv build/app/outputs/flutter-apk/app-release.apk AudireReader-Android-arm64.apk
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Build Windows via Shorebird
        if: matrix.target == 'windows'
        run: |
          git config --system core.longpaths true
          shorebird release windows --flutter-version=3.41.9
          dart run inno_bundle --no-app
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath AudireReader-Windows.zip
          Move-Item build\windows\x64\installer\Release\*.exe AudireReader-Windows-Setup.exe
        shell: pwsh
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Build iOS via Shorebird
        if: matrix.target == 'ios'
        run: |
          PLIST_PATH="ios/Runner/Info.plist"
          plutil -insert UIBackgroundModes -xml "<array><string>audio</string></array>" $PLIST_PATH || true
          plutil -replace UISupportsDocumentBrowser -bool true $PLIST_PATH || true
          plutil -replace UIFileSharingEnabled -bool true $PLIST_PATH || true
          
          shorebird release ios --no-codesign --verbose --flutter-version=3.41.9
          
          ARCHIVE_PATH=$(find build/ios/archive -name "*.xcarchive" | head -1)
          mkdir -p Payload
          cp -r "$ARCHIVE_PATH/Products/Applications/Runner.app" Payload/
          zip -r AudireReader-iOS.ipa Payload
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      # --- UPLOAD ARTIFACTS ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            AudireReader-Android-arm64.apk
            AudireReader-Windows.zip
            AudireReader-Windows-Setup.exe
            AudireReader-iOS.ipa
          if-no-files-found: ignore

  # ==========================================
  # JOB 3: TẠO RELEASE DRAFT/PUBLISH
  # ==========================================
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/AudireReader-Android-arm64.apk
            artifacts/AudireReader-Windows.zip
            artifacts/AudireReader-Windows-Setup.exe
            artifacts/AudireReader-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
